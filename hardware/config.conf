# Hardware camera and activity-monitor API settings.
# Edit this file instead of start.py. Restart the service after changes.

[camera]
# USB camera device indices
indices = 0, 2, 6
# Camera used for AI activity detection. This feed has no text overlay.
detection_index = 6
frame_width = 640
frame_height = 480
fps = 15
# Process every Nth frame
frame_skip = 3

[api]
# Activity monitor server base URL
url = http://192.168.50.22:8082
