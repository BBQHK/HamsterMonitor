[global_tags]
  cage = "hamster"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  flush_interval = "10s"

# OUTPUT
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "e3MnpvXH6H9UezCwU8Fc2D1pE59L1J"
  organization = "home"
  bucket = "hamster"

# INPUT: Hamster Cage API
[[inputs.http]]
  urls = ["http://192.168.50.167:8081/status"]
  method = "GET"
  timeout = "5s"
  data_format = "json"
  name_override = "cage_status"
  json_time_key = "timestamp"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "Asia/Hong_Kong"
  json_string_fields = ["air_quality", "hamster_activity"]
  tag_keys = ["air_quality", "hamster_activity"]